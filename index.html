<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030714" />
    <title>Get Your Ship Together — Hero Hangar</title>
  </head>
  <body>
    <main id="app">
      <div id="loading-screen" class="loading-screen">
        <div class="loading-card">
          <div class="loading-mark">GYST</div>
          <p class="eyebrow">INITIALIZING HANGAR</p>
          <h1>Getting your ship together…</h1>
          <div class="loading-track"><span id="loading-bar"></span></div>
          <p id="loading-status" class="loading-status">Loading hero assets</p>
        </div>
      </div>

      <canvas id="scene" aria-label="Three-dimensional hero hangar preview"></canvas>

      <section class="hud" aria-label="Hero hangar controls">
        <header class="masthead">
          <div class="brand-lockup">
            <span class="brand-kicker">CREW SELECTION // ACT 0</span>
            <h1 class="game-title" aria-label="Get Your Ship Together">
              <span class="title-prefix">GET YOUR</span>
              <em class="title-ship">SHIP</em>
              <span class="title-suffix">TOGETHER</span>
            </h1>
          </div>
        </header>

        <div class="hero-detail" aria-live="polite">
          <div class="detail-ident">
            <span class="detail-kicker">CREW</span>
            <strong id="selected-hero">Barbara</strong>
            <span id="selected-species" class="species-label">The Bee</span>
          </div>
          <span id="selected-number" class="detail-number">01 / 04</span>
          <button id="select-hero-button" class="select-hero-button" type="button">SELECT</button>
        </div>

        <div class="lower-hud">
          <nav id="bay-selector" class="bay-selector" aria-label="Choose hero bay"></nav>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
