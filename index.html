<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030714" />
    <title>Get Your Ship Together — Hero Hangar</title>
  </head>
  <body>
    <main id="app">
      <div id="loading-screen" class="loading-screen">
        <div class="loading-card">
          <div class="loading-mark">GYST</div>
          <p class="eyebrow">INITIALIZING HANGAR</p>
          <h1>Getting your ship together…</h1>
          <div class="loading-track"><span id="loading-bar"></span></div>
          <p id="loading-status" class="loading-status">Loading hero assets</p>
        </div>
      </div>

      <canvas id="scene" aria-label="Three-dimensional hero hangar preview"></canvas>

      <section class="hud" aria-label="Hero hangar controls">
        <header class="masthead">
          <div class="brand-lockup">
            <span class="brand-kicker">CREW SELECTION // ACT 0</span>
            <h1>Get Your Ship Together</h1>
            <p>Choose your stranded hero. Build up. Break out.</p>
          </div>
        </header>

        <div class="hero-detail" aria-live="polite">
          <div class="detail-heading">
            <span class="detail-kicker">SELECTED CREW</span>
            <span id="selected-number" class="detail-number">01 / 04</span>
          </div>
          <strong id="selected-hero">Barbara</strong>
          <span id="selected-species" class="species-label">The Bee</span>
          <span id="selected-role" class="role-label">Support systems specialist</span>
          <div class="form-path" aria-label="Hero progression">
            <span class="form-step active">ASTRONAUT</span><i></i><span class="form-step">MECH</span><i></i><span class="form-step">SHIP</span>
          </div>
          <button id="select-hero-button" class="select-hero-button" type="button">SELECT BARBARA</button>
        </div>

        <div class="lower-hud">
          <nav id="bay-selector" class="bay-selector" aria-label="Choose hero bay"></nav>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
