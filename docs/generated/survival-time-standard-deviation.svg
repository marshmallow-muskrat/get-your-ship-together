    .hero { font-size: 17px; font-weight: 700; }
    .value { font-size: 13px; fill: #bdefff; }
  </style>
  <rect width="100%" height="100%" rx="18" fill="#081120"/>
  <text x="190" y="34" class="title">Survival time distribution</text>
  <text x="190" y="54" class="subtitle">mean ± 1 SD (cyan) · median (white) · competent policy</text>
