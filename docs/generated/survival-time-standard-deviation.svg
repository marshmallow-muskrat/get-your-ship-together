<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Mean survival time and standard deviation by hero</title>
  <desc id="desc">Orange circles show means, cyan bars show plus or minus one standard deviation, and white diamonds show medians.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #dce8ff; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle, .tick { font-size: 13px; fill: #91a4c8; }
    .hero { font-size: 17px; font-weight: 700; }
    .value { font-size: 13px; fill: #bdefff; }
  </style>
  <rect width="100%" height="100%" rx="18" fill="#081120"/>
  <text x="190" y="34" class="title">Survival time distribution</text>
  <text x="190" y="54" class="subtitle">mean ± 1 SD (cyan) · median (white) · competent policy</text>
  <line x1="190" y1="60" x2="190" y2="375" stroke="#263552" stroke-width="1"/>
<text x="190" y="402" text-anchor="middle" class="tick">0m</text>
<line x1="378.75" y1="60" x2="378.75" y2="375" stroke="#263552" stroke-width="1"/>
<text x="378.75" y="402" text-anchor="middle" class="tick">5m</text>
<line x1="567.5" y1="60" x2="567.5" y2="375" stroke="#263552" stroke-width="1"/>
