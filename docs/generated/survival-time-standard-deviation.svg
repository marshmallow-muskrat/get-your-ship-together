<line x1="756.25" y1="60" x2="756.25" y2="375" stroke="#263552" stroke-width="1"/>
<text x="756.25" y="402" text-anchor="middle" class="tick">15m</text>
<line x1="945" y1="60" x2="945" y2="375" stroke="#263552" stroke-width="1"/>
<text x="945" y="402" text-anchor="middle" class="tick">20m</text>
